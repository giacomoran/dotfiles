#cloud-config

# AMD Developer Cloud setup for LeRobot training
#
# Prerequisites:
#   - AMD Developer Cloud GPU Droplet
#   - Base image: Vanilla ROCm 7.0 (provides /dev/kfd kernel driver)
#
# The ROCm PyTorch Docker container provides Python 3.12 + PyTorch 2.7.1

#:

users:
  - name: giacomoran
    groups: sudo, docker, video, render
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      # SSH public key for tiramisu
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJjL/ZlZCuKyJC345XIDkUo0/MDVvPB5McUXBjr57woa
ssh_pwauth: false

#:

runcmd:
  ##: Tailscale
  - ["sh", "-c", "curl -fsSL https://tailscale.com/install.sh | sh"]
  - [
      "sh",
      "-c",
      "echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf && echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf && sudo sysctl -p /etc/sysctl.d/99-tailscale.conf",
    ]
  # WARN: Replace YOUR_AUTH_KEY_HERE with your actual auth key
  # Generate one at https://login.tailscale.com/admin/settings/keys
  - ["tailscale", "up", "--auth-key=YOUR_AUTH_KEY_HERE"]
  - ["tailscale", "set", "--ssh"]

  ##: Start ROCm PyTorch container
  - ["sh", "-c", "docker rm -f rocm 2>/dev/null || true"]
  - [
      "docker",
      "run",
      "-d",
      "--name=rocm",
      "--device=/dev/kfd",
      "--device=/dev/dri",
      "--group-add=video",
      "--group-add=render",
      "--ipc=host",
      "--shm-size=16G",
      "--cap-add=SYS_PTRACE",
      "--security-opt=seccomp=unconfined",
      "-v=/home/giacomoran:/home/giacomoran",
      "-w=/home/giacomoran",
      "rocm/pytorch:rocm7.0_ubuntu24.04_py3.12_pytorch_release_2.7.1",
      "sleep",
      "infinity",
    ]

#:

final_message: |
  cloud-init completed!
  Version: $version
  Timestamp: $timestamp
  Uptime: $uptime

  Next steps:
    1. SSH into the host
    2. Run: curl -fsSL https://raw.githubusercontent.com/giacomoran/dotfiles/remote/lerobot-amd/bootstrap.sh | bash
    3. Connect to container: dtach -A /tmp/rocm docker exec -it rocm /usr/bin/fish
